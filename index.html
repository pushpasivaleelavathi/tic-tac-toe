<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>Tic Tac Toe</h1>

        <p id="turn">Player X's Turn</p>

        <div class="board">

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

            <button class="cell"></button>
            <button class="cell"></button>
            <button class="cell"></button>

        </div>

        <div class="score">
            <span>X : <b id="xScore">0</b></span>
            <span>O : <b id="oScore">0</b></span>
        </div>

        <p id="result"></p>

        <button id="newGame">New Game</button>

    </div>

    <script src="script.js"></script>

</body>
</html>
